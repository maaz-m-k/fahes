# Fahes on Fly.io: ONE public app (the desk at /, the engine API under /api). Secrets are set with
# `fly secrets set` (see scripts/deploy.sh); no values live in this file. Secret names:
#   ISTIBAQ_OFFICER_TOKEN (maintenance only; the desk needs no passcode), OPENAI_API_KEY, OPENROUTER_API_KEY,
#   BRAVE_API_KEY, GOOGLE_PLACES_API_KEY, DATAFORSEO_LOGIN, DATAFORSEO_PASSWORD
# Fly has no UAE region; fra is the nearest good one.
app = "fahes"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  ISTIBAQ_DB = "/data/istibaq.db"
  ISTIBAQ_CAPTURE_DIR = "/data/captures"
  ISTIBAQ_FOOTAGE_DIR = "/data/footage"
  ISTIBAQ_PUBLIC_URL = "https://fahes.fly.dev"
  ISTIBAQ_SCHEDULE = "1"
  ISTIBAQ_RECORD_FOOTAGE = "1"
  ISTIBAQ_DATAFORSEO = "1"
  ISTIBAQ_AI_LAYER = "1"
  # limits for the open desk (istibaq/api/limits.py); ISTIBAQ_VOICE=0 / ISTIBAQ_PAID=0 switch voice / paid searches off
  ISTIBAQ_SCORE_PER_MINUTE = "60"
  ISTIBAQ_BATCH_MAX = "1000"

[[mounts]]
  source = "istibaq_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

# Chromium for capture and recording plus ffmpeg need room: 2 GB
[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
